# 교수님 maria_db.yml 템플릿 기반 (학습 목적) - 통합 배차 AI 플랫폼용 MariaDB
#
# 실행 (프로젝트 루트에서, Docker Desktop 실행 후)
#   cp docker/.env.example docker/.env
#   docker compose -p dispatch_ai -f docker/maria_db.yml up -d
#
# 접속 정보 (.env의 ASYNC_DB_URL과 일치해야 함)
#   host 127.0.0.1 / port 3379 / db dispatch_ai / user manager
#
# Ground Rule : 모든 테이블명/컬럼명은 소문자로 작성

services:
  sqldb:
    image: mariadb:10.5.18
    container_name: dispatch_ai_sqldb
    ports:
      - "3379:3306"

    env_file:
      - ./.env

    environment:
      TZ: Asia/Seoul

    volumes:
      # MariaDB 설정 파일 (utf8mb4)
      - ./conf.d:/etc/mysql/conf.d:ro

      # DB 데이터 (영구 저장, 커밋 제외)
      - ./data:/var/lib/mysql

      # 초기 SQL 스크립트 (최초 초기화시에만 실행됨)
      - ./initdb.d:/docker-entrypoint-initdb.d:ro

      # 백업 디렉토리
      - ./bak:/home/bak

    # 맥북 메모리 상황에 맞춰 1G로 조정 (템플릿 기본 2G)
    command:
      - mysqld
      - --innodb_buffer_pool_size=1G
      - --innodb_buffer_pool_instances=1
      - --lower_case_table_names=1

    networks:
      - backend

    restart: unless-stopped

networks:
  backend:
    driver: bridge
